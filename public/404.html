<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>מידע למטייל</title>
    <!--
      GitHub Pages serves this file for any unknown path under
      /midaa-lametayel/. It doesn't render anything - it just re-encodes the
      real path into a query string and redirects to index.html, which
      decodes it back (see the matching script in index.html) before React
      Router ever runs. pathSegmentsToKeep = 1 keeps the "/midaa-lametayel"
      repo-name segment, matching vite.config.ts's `base`.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
